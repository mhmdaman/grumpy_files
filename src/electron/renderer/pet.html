<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GrumpyDuck Desktop Pet</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="pet-container">
    <!-- Speech bubble container -->
    <div id="speech-bubble-container" aria-live="polite"></div>

    <!-- Debug mode overlay -->
    <div id="debug-overlay" class="debug-overlay hidden">
      <div id="debug-state" class="debug-text">State: IDLE</div>
      <div id="debug-platform" class="debug-text">Platform: macOS Dock</div>
    </div>

    <!-- Duck Character Wrapper -->
    <div id="duck-wrapper" title="GrumpyDuck (Right-click for options)">
      <img id="duck-img" class="duck-sprite" alt="GrumpyDuck" draggable="false">
    </div>
  </div>

  <script src="GifAnimator.js"></script>
  <script src="SpeechBubble.js"></script>
  <script src="GrumpyDuck.js"></script>
</body>
</html>
